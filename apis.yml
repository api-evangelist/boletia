aid: boletia
name: Boletia
description: Boletia (Boletia Mexico SA de CV) is a Mexican event ticketing, registration, and access-management
  platform headquartered in Monterrey, Nuevo Leon. Event organizers use Boletia to create and promote events,
  sell tickets online, manage attendee registration, assign numbered seating, publish billboards (cartelera) and
  venue pages, and control event-day access and check-in. The platform spans concerts, comedy and stand-up, sports,
  expos and congresses, festivals, theater, and workshops across Mexico, and provides the payment and infrastructure
  backend that powers ticket sales for its event organizers. Boletia is backed by 500 Global.
